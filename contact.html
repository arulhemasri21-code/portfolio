    <div class="scroll-progress-bar" id="scrollProgressBar"></div>
  </div>

  <header class="header" id="header" role="banner">
    <nav class="nav container" role="navigation" aria-label="Main navigation">
      <a href="index.html" class="nav-logo" aria-label="Home">HA</a>

        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
          <i class="fas fa-moon" id="themeIcon"></i>

          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <section id="contact" class="contact section" aria-label="Contact">
    <div class="container">
      <div class="section-header">
        <span class="section-subtitle">Get In Touch</span>
        <h2 class="section-title">Contact <span class="gradient-text">Me</span></h2>
        <div class="section-divider"></div>
      </div>
      <div class="contact-content reveal">
        <div class="contact-info">
          <div class="contact-item">
            <div class="contact-icon"><i class="fas fa-envelope"></i></div>
            <div>
              <h4>Email</h4>
              <a href="mailto:arulhemasri21@gmail.com">arulhemasri21@gmail.com</a>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-icon"><i class="fas fa-map-marker-alt"></i></div>
            <div>
              <h4>Location</h4>
              <p>Cuddalore, Tamilnadu</p>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-icon"><i class="fab fa-github"></i></div>
            <div>
              <h4>GitHub</h4>
              <a href="https://github.com/arulhemasri21-code" target="_blank" rel="noopener">arulhemasri21-code</a>
            </div>
          </div>
          <div class="contact-item">
            <div class="contact-icon"><i class="fab fa-linkedin-in"></i></div>
            <div>
              <h4>LinkedIn</h4>
              <a href="https://www.linkedin.com/in/hemasri-a-61a139381" target="_blank" rel="noopener">Hemasri A</a>
            </div>
          </div>
        </div>
        <form class="contact-form" id="contactForm" novalidate>
          <div class="form-group floating-label">
            <input type="text" id="formName" class="form-input" required autocomplete="name">
            <label for="formName">Your Name</label>
            <span class="form-error"></span>
          </div>
          <div class="form-group floating-label">
            <input type="email" id="formEmail" class="form-input" required autocomplete="email">
            <label for="formEmail">Your Email</label>
            <span class="form-error"></span>
          </div>
          <div class="form-group floating-label">
            <input type="text" id="formSubject" class="form-input" required>
            <label for="formSubject">Subject</label>
            <span class="form-error"></span>
          </div>
          <div class="form-group floating-label">
            <textarea id="formMessage" class="form-input form-textarea" required rows="5"></textarea>
            <label for="formMessage">Your Message</label>
            <span class="form-error"></span>
          </div>
          <button type="submit" class="btn btn-primary btn-glow btn-ripple" id="formSubmit">
            <i class="fas fa-paper-plane"></i> Send Message
          </button>
        </form>
      </div>
    </div>
  </section>

      <svg viewBox="0 0 1200 120" preserveAspectRatio="none">

      </div>

      </p>
    </div>
    <button class="back-to-top" id="backToTop" aria-label="Back to top">
      <i class="fas fa-rocket"></i>
    </button>
  </footer>
